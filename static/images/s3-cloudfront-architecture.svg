<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 300" role="img" aria-labelledby="diagTitle diagDesc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <title id="diagTitle">Private S3 static site behind CloudFront</title>
  <desc id="diagDesc">A browser makes a TLS request to CloudFront, which fetches objects from a private S3 bucket using an Origin Access Control signed request.</desc>

  <!-- card background -->
  <rect x="1" y="1" width="818" height="298" rx="14" fill="#0f172a" stroke="#334155" stroke-width="2"/>

  <text x="410" y="40" text-anchor="middle" fill="#e2e8f0" font-size="20" font-weight="700">Private S3 static site behind CloudFront</text>

  <!-- arrows -->
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#64748b"/>
    </marker>
  </defs>

  <!-- Node 1: Browser -->
  <rect x="30" y="120" width="180" height="96" rx="10" fill="#1e293b" stroke="#3b82f6" stroke-width="2"/>
  <text x="120" y="162" text-anchor="middle" fill="#f8fafc" font-size="18" font-weight="600">Browser</text>
  <text x="120" y="186" text-anchor="middle" fill="#94a3b8" font-size="13">End user request</text>

  <!-- arrow 1 -->
  <line x1="212" y1="168" x2="316" y2="168" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="264" y="156" text-anchor="middle" fill="#94a3b8" font-size="12">TLS 443</text>

  <!-- Node 2: CloudFront -->
  <rect x="320" y="120" width="180" height="96" rx="10" fill="#1e293b" stroke="#a855f7" stroke-width="2"/>
  <text x="410" y="158" text-anchor="middle" fill="#f8fafc" font-size="18" font-weight="600">CloudFront</text>
  <text x="410" y="180" text-anchor="middle" fill="#94a3b8" font-size="12">WAF &#183; ACM cert</text>
  <text x="410" y="197" text-anchor="middle" fill="#94a3b8" font-size="12">edge caching</text>

  <!-- arrow 2 -->
  <line x1="502" y1="168" x2="606" y2="168" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="554" y="156" text-anchor="middle" fill="#94a3b8" font-size="12">OAC (SigV4)</text>

  <!-- Node 3: S3 -->
  <rect x="610" y="120" width="180" height="96" rx="10" fill="#1e293b" stroke="#22c55e" stroke-width="2"/>
  <text x="700" y="158" text-anchor="middle" fill="#f8fafc" font-size="18" font-weight="600">S3 bucket</text>
  <text x="700" y="180" text-anchor="middle" fill="#94a3b8" font-size="12">Private</text>
  <text x="700" y="197" text-anchor="middle" fill="#94a3b8" font-size="12">Block Public Access on</text>

  <!-- caption -->
  <text x="410" y="262" text-anchor="middle" fill="#64748b" font-size="13">Bucket policy grants read access only to this distribution. No public objects, no website endpoint.</text>
</svg>
